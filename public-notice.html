<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="theme-color" content="#11100e">
  <title>Public Notice — Eutaw Jazz</title>
  <link rel="stylesheet" href="styles.css">
  <style>
    .notice-page { background: #eee6d3; color: #171513; min-height: 100svh; padding: 130px 5vw 90px; }
    .notice-title { font: 500 clamp(38px, 7vw, 92px)/.95 Georgia, serif; letter-spacing: -.035em; margin: 0 0 70px; }
    .notice-list { display: grid; gap: 70px; max-width: 1050px; margin: 0 auto; }
    .notice-item { margin: 0; }
    .notice-item img { display: block; width: 100%; height: auto; }
    .notice-meta { display: flex; justify-content: space-between; gap: 20px; margin-top: 12px; font: 500 10px/1.4 "DM Mono", monospace; letter-spacing: .12em; text-transform: uppercase; }
    @media (max-width: 760px) {
      .notice-page { padding: 105px 18px 60px; }
      .notice-title { margin-bottom: 45px; }
      .notice-list { gap: 45px; }
      .notice-meta { display: block; }
    }
  </style>
</head>
<body>
  <header class="site-header">
    <a class="wordmark" href="index.html" aria-label="Eutaw Jazz home">
      <span>BALTIMORE, AMERICA</span>
      <strong>EUTAW JAZZ</strong>
    </a>
    <button class="menu-button" aria-expanded="false" aria-controls="site-nav">MENU</button>
    <nav id="site-nav" class="site-nav" aria-label="Primary navigation">
      <a href="public-notice.html">PUBLIC NOTICE</a>
      <a href="opening-day.html">OPENING DAY</a>
      <a href="gallery.html">GALLERY</a>
      <a href="https://www.instagram.com/eutawcentral/" target="_blank" rel="noopener">CENTRAL</a>
    </nav>
  </header>

  <main class="notice-page">
    <h1 class="notice-title">PUBLIC NOTICE</h1>
    <section class="notice-list" aria-label="Public Notice">
      <article class="notice-item">
        <img src="assets/public-notice-inaugural-season.png" alt="Eutaw Central memorandum announcing The Inaugural Season, dated September 26, 2025">
        <div class="notice-meta">
          <span>SEPT. 26, 2025</span>
          <span>THE INAUGURAL SEASON</span>
        </div>
      </article>

      <article class="notice-item">
        <img src="assets/public-notice-opening-day.png" alt="Eutaw Central memorandum announcing Opening Day, dated July 6, 2026">
        <div class="notice-meta">
          <span>JULY 6, 2026</span>
          <span>OPENING DAY</span>
        </div>
      </article>
    </section>
  </main>
  <script src="script.js"></script>
</body>
</html>
